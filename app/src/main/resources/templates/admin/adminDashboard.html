<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>

    <!-- CSS Links -->
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <!-- JS Utilities (Defer) -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>

    <!-- JS Components (Defer) -->
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
</head>
<body>

    <div class="container">
        <div class="wrapper">
            <!-- Header Dinámico -->
            <div id="header"></div>

            <!-- Contenido Principal -->
            <main class="main-content">
                <!-- Barra de búsqueda -->
                <input type="text" id="searchBar" class="input-field" placeholder="buscar por nombre de doctor" />

                <!-- Filtros desplegables -->
                <div class="filter-section">
                    <select id="sortByTime" class="select-dropdown">
                        <option value="">Todos los horarios</option>
                        <option value="AM">Mañana (AM)</option>
                        <option value="PM">Tarde (PM)</option>
                    </select>

                    <select id="filterBySpecialty" class="select-dropdown">
                        <option value="">Todas las especialidades</option>
                    </select>
                </div>

                <!-- Contenedor dinámico de lista de doctores -->
                <div id="content"></div>
            </main>

            <!-- Footer Dinámico -->
            <div id="footer"></div>
        </div>
    </div>

    <!-- Modal para Agregar Doctor -->
    <div id="modal" class="modal" style="display: none;">
        <span id="closeModal" class="close">&times;</span>
        <div id="modal-body"></div>
    </div>

    <!-- Scripts de Módulos JavaScript -->
    <script type="module" th:src="@{/js/adminDashboard.js}" defer></script>
    <script type="module" th:src="@{/js/components/doctorCard.js}" defer></script>
</body>
</html>
